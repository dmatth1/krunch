name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1:
    name: Tier 1 — local checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install constriction tokenizers zstandard numpy \
                      pytest jsonschema jinja2 pyyaml

      - name: Fetch tokenizer (for normalizer + blob tests)
        run: |
          mkdir -p models
          curl -sL https://github.com/BlinkDL/RWKV-LM/raw/main/RWKV-v4/20B_tokenizer.json \
            -o models/20B_tokenizer.json

      - name: Unit tests
        run: |
          PYTHONPATH=. pytest tests/unit/ -v

      - name: Set up Node for CDK
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CDK type-check
        # `cdk synth` needs real AWS credentials (ec2.Vpc.fromLookup +
        # MachineImage.lookup hit the AWS API). Skipped in CI; run locally
        # via tests/quick.sh which authenticates against a real account.
        run: |
          cd deploy/aws-cdk
          npm install --silent
          npx tsc --noEmit

      - name: krunch plan --dry-run end-to-end
        run: |
          # Exercises the in-image plan_cli argparse path against the
          # source tree. Emits the rendered plan to the CI log for quick
          # visual diff when templates change.
          PYTHONPATH=. python -m krunch.plan_cli \
            --target aws-batch --mode compress \
            --source s3://test/in --dest s3://test/out \
            --workers 4 --image ghcr.io/dmatth1/krunch:latest \
            --input-len 1048576 | head -40
