name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1:
    name: Tier 1 — local checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps for smoke test
        run: |
          python -m pip install --upgrade pip
          pip install constriction tokenizers zstandard numpy

      - name: Unit tests (blob format, AC codec, chunking, CRC, tokenizer)
        run: |
          # The blob test loads the GPT-NeoX BPE tokenizer from models/.
          mkdir -p models
          curl -sL https://github.com/BlinkDL/RWKV-LM/raw/main/RWKV-v4/20B_tokenizer.json \
            -o models/20B_tokenizer.json
          python tests/unit/test_blob.py

      - name: Set up Node for CDK
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CDK type-check
        # `cdk synth` needs real AWS credentials (ec2.Vpc.fromLookup +
        # MachineImage.lookup hit the AWS API). Skipped in CI; run locally
        # via tests/quick.sh which authenticates against a real account.
        run: |
          cd deploy/aws-cdk
          npm install --silent
          npx tsc --noEmit

      - name: krunch plan --dry-run (renderer + CLI)
        run: |
          pip install pytest jsonschema jinja2 pyyaml
          # 1. Render + schema-validate every plan target directly against
          #    the krunch package. Catches template syntax errors, missing
          #    placeholders, malformed JSON/YAML before they reach ghcr.io.
          PYTHONPATH=. pytest tests/unit/ -v
          # 2. Exercise the in-image plan_cli argparse path end-to-end
          #    against the source tree (same module that runs inside the
          #    Docker image). Emits the rendered plan to the CI log for
          #    quick visual diff when templates change.
          PYTHONPATH=. python -m krunch.plan_cli \
            --target aws-batch --mode compress \
            --source s3://test/in --dest s3://test/out \
            --workers 4 --image ghcr.io/dmatth1/krunch:latest \
            --input-len 1048576 | head -40
